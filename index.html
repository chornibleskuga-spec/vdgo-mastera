    <title>ВДГО Мастер</title>

    <link rel="stylesheet" crossorigin href="./assets/index-BxHpXEWR.css">

  <body>
    <div id="root">
      <div style="padding:40px;font-family:sans-serif;text-align:center;color:#333">
        <h1>ВДГО Мастер</h1>
        <p>Загрузка...</p>
        <noscript>JavaScript должен быть включен</noscript>
      </div>
    </div>
    <script>
      // Error handler — shows JS errors that prevent React from mounting
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<pre style="padding:20px;color:#c00;font-family:monospace;font-size:13px;line-height:1.5;background:#fee;border:1px solid #fcc;border-radius:8px;margin:20px;overflow:auto;max-height:80vh">' + '<b>JS Error:</b> ' + e.message + '\n\n<b>File:</b> ' + (e.filename || '') + '\n<b>Line:</b> ' + (e.lineno || '') + ':' + (e.colno || '') + '\n\n<b>Stack:</b>\n' + ((e.error && e.error.stack) || 'N/A') + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<pre style="padding:20px;color:#c00;font-family:monospace;font-size:13px;line-height:1.5;background:#fee;border:1px solid #fcc;border-radius:8px;margin:20px;overflow:auto;max-height:80vh">' + '<b>Unhandled Promise Rejection:</b> ' + e.reason + '\n\n<b>Stack:</b>\n' + ((e.reason && e.reason.stack) || 'N/A') + '</pre>';
      });
    </script>

    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(registration) {
            console.log('SW registered: ', registration.scope);
          }).catch(function(error) {
            console.log('SW registration failed: ', error);
          });
        });
      }

      // Capture beforeinstallprompt for the React InstallPrompt component
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });

      // Listen for appinstalled
      window.addEventListener('appinstalled', () => {
        window.__deferredInstallPrompt = null;
      });
    </script>
  </body>
