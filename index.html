<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ECECEC" />
    <meta name="background-color" content="#ECECEC" />
    <meta name="description" content="ВДГО Мастер — управление работами, кейсы, KPI, диспетчер, прейскурант" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ВДГО Мастер" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ВДГО Мастер" />
    <meta name="msapplication-TileColor" content="#ECECEC" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Иконки в стиле Apple: вектор для современных браузеров, PNG как запасной
         вариант, отдельная иконка для домашнего экрана iOS -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <meta name="msapplication-TileImage" content="./icon-192.png" />

    <title>ВДГО Мастер</title>
    <!-- Действия, добавленные к приложению: удаление «Истории обзвона» за день,
         кассы, выгрузка для табеля, перенос старых записей KPI на помесячные
         ключи. Загружается ДО бандла и без defer: перенос данных должен пройти
         раньше, чем приложение прочитает их из localStorage.
         Номер версии в адресе — чтобы браузер не отдавал старый файл из кэша. -->
    <script src="./macos-actions.js?v=50"></script>
    <script type="module" crossorigin src="./assets/index-BPE8RHuQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BxHpXEWR.css">
    <!-- macOS-тема: свой слой после основного CSS, бандл не изменяется -->
    <link rel="stylesheet" href="./macos-theme.css?v=50">
    <!-- Иконки macOS: маски на все иконки приложения (файл сгенерирован) -->
    <link rel="stylesheet" href="./macos-icons.css?v=50">
    <script src="./macos-chrome.js?v=50" defer></script>
    <!-- Свои диалоги вместо системных окон браузера: системные не показываются
         в приложении с домашнего экрана iOS и блокируются в Chrome -->
    <script src="./macos-dialogs.js?v=50" defer></script>
  </head>
  <body>
    <div id="root">
      <div style="padding:56px 40px;font-family:inherit;text-align:center;color:var(--text-secondary)">
        <h1>ВДГО Мастер</h1>
        <p>Загрузка...</p>
        <noscript>JavaScript должен быть включен</noscript>
      </div>
    </div>
    <script>
      // Error handler — shows JS errors that prevent React from mounting
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<pre style="padding:20px;color:#c00;font-family:monospace;font-size:13px;line-height:1.5;background:#fee;border:1px solid #fcc;border-radius:8px;margin:20px;overflow:auto;max-height:80vh">' + '<b>JS Error:</b> ' + e.message + '\n\n<b>File:</b> ' + (e.filename || '') + '\n<b>Line:</b> ' + (e.lineno || '') + ':' + (e.colno || '') + '\n\n<b>Stack:</b>\n' + ((e.error && e.error.stack) || 'N/A') + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<pre style="padding:20px;color:#c00;font-family:monospace;font-size:13px;line-height:1.5;background:#fee;border:1px solid #fcc;border-radius:8px;margin:20px;overflow:auto;max-height:80vh">' + '<b>Unhandled Promise Rejection:</b> ' + e.reason + '\n\n<b>Stack:</b>\n' + ((e.reason && e.reason.stack) || 'N/A') + '</pre>';
      });
    </script>

    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(registration) {
            console.log('SW registered: ', registration.scope);
          }).catch(function(error) {
            console.log('SW registration failed: ', error);
          });
        });
      }

      // Capture beforeinstallprompt for the React InstallPrompt component
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });

      // Listen for appinstalled
      window.addEventListener('appinstalled', () => {
        window.__deferredInstallPrompt = null;
      });
    </script>
    <script>
      // Если приложение не поднялось за 8 секунд — показываем, чего не хватает.
      // Чаще всего это открытие файла напрямую (file://) или не загрузившийся
      // файл приложения: тогда вместо «Загрузка...» появится понятная подсказка.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || !/Загрузка/.test(root.textContent || '')) return;
        var info =
          'Приложение не запустилось.\n\n' +
          'Адрес страницы: ' + location.href + '\n' +
          'Файл приложения: ./assets/index-BPE8RHuQ.js\n\n';
        if (location.protocol === 'file:') {
          root.innerHTML =
            '<pre style="padding:20px;font-family:monospace;font-size:13px;line-height:1.6;background:#fee;color:#900;border:1px solid #fcc;border-radius:10px;margin:20px;white-space:pre-wrap">' +
            info +
            'Страница открыта как файл (file://). Так приложение не работает — нужен адрес http:// или https://: локальный сервер или адрес GitHub Pages.</pre>';
          return;
        }
        var probe = document.createElement('script');
        probe.src = './assets/index-BPE8RHuQ.js';
        probe.onerror = function () {
          root.innerHTML =
            '<pre style="padding:20px;font-family:monospace;font-size:13px;line-height:1.6;background:#fee;color:#900;border:1px solid #fcc;border-radius:10px;margin:20px;white-space:pre-wrap">' +
            info +
            'Файл приложения не загрузился (404). Проверьте, что в корне лежат index.html и папка assets с файлами из архива — без вложенной папки.</pre>';
        };
        document.head.appendChild(probe);
      }, 8000);
    </script>
  </body>
</html>
