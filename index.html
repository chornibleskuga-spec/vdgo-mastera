    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='./peerjs.min.js';document.head.appendChild(s);"></script>

  <body>
    <div id="root">
      <div style="padding:40px;font-family:sans-serif;text-align:center;color:#333">
        <h1>ВДГО Мастер</h1>
        <p>Загрузка...</p>
        <noscript>JavaScript должен быть включен</noscript>
      </div>
    </div>

    <script>
      window.__errors = [];
      window.onerror = function(msg, url, line, col, err) {
        window.__errors.push(String(msg) + ' at ' + url + ':' + line);
        document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif"><h2 style="color:red">JS Error</h2><pre style="white-space:pre-wrap">' + window.__errors.join('\n') + '</pre></div>';
        return true;
      };
      window.onunhandledrejection = function(e) {
        window.__errors.push('Promise: ' + String(e.reason));
        document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif"><h2 style="color:red">JS Error</h2><pre style="white-space:pre-wrap">' + window.__errors.join('\n') + '</pre></div>';
      };
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(registration) {
            console.log('SW registered: ', registration.scope);
          }).catch(function(error) {
            console.log('SW registration failed: ', error);
          });
        });
      }

      // Capture beforeinstallprompt for the React InstallPrompt component
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });

      // Listen for appinstalled
      window.addEventListener('appinstalled', () => {
        window.__deferredInstallPrompt = null;
      });
    </script>
  </body>
